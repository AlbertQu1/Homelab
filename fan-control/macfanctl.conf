# Config file for macfanctl daemon
#
# Note: 0 < temp_X_floor < temp_X_ceiling
#       0 < fan_min < 6200

fan_min: 2000

temp_avg_floor: 45
temp_avg_ceiling: 55

temp_TC0P_floor: 50
temp_TC0P_ceiling: 58

temp_TG0P_floor: 50
temp_TG0P_ceiling: 58

# CORE = coretemp "Package id 0", the CPU die sensor. applesmc has no
# visibility into this at all, so without it the fan never reacts to the
# real CPU temperature, only to the slower/cooler case proximity sensors.
# Requires the patched macfanctld binary (adds coretemp support).
temp_CORE_floor: 45
temp_CORE_ceiling: 55

# Add sensors to be excluded here, separated by space, i.e.
# exclude: 1 7
# will disable reading of sensors temp1_input and temp7_input.

exclude:

# log_level values:
#   0: Startup / Exit logging only
#   1: Basic temp / fan logging
#   2: Log all sensors

log_level: 0
